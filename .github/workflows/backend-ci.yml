name: Backend CI

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore QQuote.Insurance.slnx

      - name: Build
        run: dotnet build QQuote.Insurance.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test QQuote.Insurance.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
        env:
          DOTNET_ENVIRONMENT: Testing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/TestResults/**/*.trx
          retention-days: 7
